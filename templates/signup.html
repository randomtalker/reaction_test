<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="brand">반응속도 랭킹</p>
    <h1>회원가입</h1>
    <form method="post">
      <div class="field">
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" name="nickname" autocomplete="username">
        <p class="hint">영문 소문자·숫자 4~16자, 숫자로 시작할 수 없음</p>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="pw-wrap">
          <input id="password" type="password" name="password" autocomplete="new-password">
          <button type="button" class="toggle" onclick="togglePw(this)">표시</button>
        </div>
        <p class="hint">8~64자, 대문자·소문자·숫자·특수문자 각 1개 이상<br>공백·한글 사용 불가 · 분실 시 복구할 수 없음<br>보안이 허벌이니 평소 쓰시는 아이디 비밀번호 조합은 피해주세요</p>
      </div>
      <button type="submit" class="submit">가입하기</button>
    </form>
    <p class="switch">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
  </main>
  <script>
    function togglePw(btn) {
      const input = btn.previousElementSibling;
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      btn.textContent = hidden ? "숨김" : "표시";
    }
  </script>
</body>
</html>
