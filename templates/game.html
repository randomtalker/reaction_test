<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>반응속도 측정</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: sans-serif;
      background: #f3f4f6;
    }
    #round {
      margin: 0;
      font-size: 1.5rem;
      font-weight: bold;
    }
    #game-area {
      width: 90vw;
      height: 60vh;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 2.5rem;
      font-weight: bold;
      text-align: center;
      white-space: pre-line;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
    }
    .idle    { background-color: #6b7280; }
    .waiting { background-color: #b85450; }
    .go      { background-color: #4a78a8; }
    table {
      border-collapse: collapse;
      font-size: 1rem;
    }
    th, td {
      border: 1px solid #d1d5db;
      padding: 8px 10px;
      min-width: 56px;
      text-align: center;
    }
    th   { background: #e5e7eb; }
    #avg { font-weight: bold; }

    #actions {
      display: flex;
      gap: 12px;
    }
    #actions[hidden] { display: none; }   /* display:flex가 hidden을 덮어쓰지 않게 */
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-retry   { background: #4a78a8; }
    .btn-ranking { background: #6b7280; }
    .logout {
      color: #6b7280;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <p id="round">1 / 3</p>

  <div id="game-area" class="idle">눌러서 시작</div>

  <table>
    <tr><th>1회차</th><th>2회차</th><th>3회차</th><th>평균</th></tr>
    <tr><td id="r1">-</td><td id="r2">-</td><td id="r3">-</td><td id="avg">-</td></tr>
  </table>

  <div id="actions" hidden>
    <button id="retry" class="btn btn-retry" type="button">한 번 더하기</button>
    <a class="btn btn-ranking" href="{{ url_for('ranking') }}">랭킹 보기</a>
  </div>

  <a class="logout" href="{{ url_for('log_out') }}">로그아웃</a>

  <script>
    const ROUNDS = 3;
    const MIN_MS = 100;
    const MAX_MS = 10000;

    const area = document.getElementById("game-area");
    const roundLabel = document.getElementById("round");
    const avgCell = document.getElementById("avg");
    const actions = document.getElementById("actions");
    const retryBtn = document.getElementById("retry");

    let state = "idle";   // "idle" → "waiting" → "go" → "idle" … 3회 끝나면 "done"
    let goTime = 0;       // 파란색으로 바뀐 순간의 시각
    let timerId = null;   // "몇 초 뒤 파랑" 예약 번호
    let records = [];     // 이번 판의 회차별 기록

    function resetTable() {
      for (let i = 1; i <= ROUNDS; i++) {
        document.getElementById("r" + i).textContent = "-";
      }
      avgCell.textContent = "-";
    }

    function fail(message) {
      clearTimeout(timerId);
      records = [];
      resetTable();
      roundLabel.textContent = "1 / " + ROUNDS;
      state = "idle";
      area.className = "idle";
      area.textContent = message + "\n눌러서 처음부터";
    }

    // 한 회차 시작 (영역 클릭과 "한 번 더하기" 버튼이 같이 사용)
    function startRound() {
      if (records.length === 0) {   // 새 판 시작
        resetTable();
        fetch("/game/start", { method: "POST" });
      }
      roundLabel.textContent = (records.length + 1) + " / " + ROUNDS;
      state = "waiting";
      area.className = "waiting";
      area.textContent = "대기";

      const delay = 1000 + Math.random() * 4000;   // 1000~5000ms
      timerId = setTimeout(() => {
        state = "go";
        area.className = "go";
        area.textContent = "클릭!";
        goTime = performance.now();
      }, delay);
    }

    area.addEventListener("pointerdown", () => {
      if (state === "idle") {
        startRound();

      } else if (state === "waiting") {
        fail("너무 빨랐습니다");

      } else if (state === "go") {
        const ms = Math.round(performance.now() - goTime);
        if (ms < MIN_MS) { fail("100ms 미만 무효"); return; }
        if (ms >= MAX_MS) { fail("10초 이상"); return; }

        records.push(ms);
        document.getElementById("r" + records.length).textContent = ms;
        area.className = "idle";

        if (records.length < ROUNDS) {
          state = "idle";
          roundLabel.textContent = (records.length + 1) + " / " + ROUNDS;
          area.textContent = ms + " ms\n눌러서 다음 회차";
        } else {
          state = "done";   // 이후 영역은 눌러도 반응 없음, 버튼으로만 진행
          roundLabel.textContent = "완료";
          area.textContent = "계산 중...";

          fetch("/game/submit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ records: records }),
          })
            .then((res) => {
              if (!res.ok) throw new Error(res.status);   // 400·401 등은 실패로 처리
              return res.json();
            })

            .then((data) => {
              avgCell.textContent = data.avg;
              let text = "이번 " + data.avg + " ms\n최고 " + data.best + " ms";
              if (data.updated) {
                text = "최고 기록 갱신!\n" + text;
              }
              area.textContent = text;
            })


            .catch(() => {
              area.textContent = "기록 저장 실패";
            })
            .finally(() => {
              actions.hidden = false;   // 성공·실패 상관없이 버튼 표시
            });

          records = [];
        }
      }
      // state === "done"이면 위 어느 분기에도 안 걸려서 아무 일도 안 일어남
    });

    retryBtn.addEventListener("click", () => {
      actions.hidden = true;
      startRound();
    });
  </script>
</body>
</html>
