<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <p class="brand">반응속도 랭킹</p>
    <h1>로그인</h1>
    {% if error %}
    <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post">
      <div class="field">
        <label for="nickname">닉네임</label>
        <input id="nickname" type="text" name="nickname" autocomplete="username" value="{{ nickname }}">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="pw-wrap">
          <input id="password" type="password" name="password" autocomplete="current-password">
          <button type="button" class="toggle" onclick="togglePw(this)">표시</button>
        </div>
      </div>
      <button type="submit" class="submit">로그인</button>
    </form>
    <p class="switch">계정이 없으신가요? <a href="/signup">회원가입</a></p>
  </main>
  <script>
    function togglePw(btn) {
      const input = btn.previousElementSibling;
      const hidden = input.type === "password";
      input.type = hidden ? "text" : "password";
      btn.textContent = hidden ? "숨김" : "표시";
    }
  </script>
</body>
</html>
